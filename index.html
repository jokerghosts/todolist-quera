<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-background: var(--background);
        --color-blue: var(--blue);
        --color-gray: var(--gray);
        --color-gray-light: var(--gray-light);
        --color-yellow: var(--yellow);
        --color-orange: var(--orange);
        --color-turquoise: var(--turquoise);

        --color-blue-light: var(--blue-light);
        --color-yellow-light: var(--yellow-light);
        --color-orange-light: var(--orange-light);
        --color-turquoise-light: var(--turquoise-light);

        --radius-8: 8px;
        --radius-12: 12px;
        --radius-16: 16px;
        --font-weight-normal: 400;
        --font-weight-semibold: 600;
        --font-weight-bold: 700;
        --font-weight-extrabold: 800;
      }
      @layer base {
        :root {
          /* light theme */
          --background: #ffffff;
          --blue: #007bff;
          --gray: #525252;
          --gray-light: #afaeb2;
          --yellow: #ffaf37;
          --orange: #ff5f37;
          --turquoise: #11a483;
          --blue-light: #f5faff;
          --yellow-light: #ffefd6;
          --orange-light: #ffe2db;
          --turquoise-light: #c3fff1;
        }
        .dark {
          --background: #060c18;
          --blue: #57a8ff;
          --gray: #525252;
          --gray-light: #afaeb2;
          --yellow: #ffaf37;
          --orange: #ff5f37;
          --turquoise: #11a483;
          --blue-light: #041933;
          --yellow-light: #ffefd6;
          --orange-light: #ffe2db;
          --turquoise-light: #c3fff1;
        }
      }
    </style>

    <title>Document</title>
  </head>
  <body></body>
</html>
