<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      @font-face {
        font-family: "YekanBakh";
        src: url("./src/assets/fonts/yekan-bakh-regular.woff") format("woff");
        font-weight: 400;
      }

      @font-face {
        font-family: "YekanBakh";
        src: url("./src/assets/fonts/yekan-bakh-bold.woff") format("woff");
        font-weight: 700;
      }
    </style>

    <style type="text/tailwindcss">
      @theme {
        --font-yekan: "YekanBakh", sans-serif;
      }
    </style>

    <style type="text/tailwindcss">
      @theme {
        --color-background: var(--background);
        --color-blue: var(--blue);
        --color-gray: var(--gray);
        --color-gray-light: var(--gray-light);
        --color-yellow: var(--yellow);
        --color-orange: var(--orange);
        --color-turquoise: var(--turquoise);

        --color-blue-light: var(--blue-light);
        --color-yellow-light: var(--yellow-light);
        --color-orange-light: var(--orange-light);
        --color-turquoise-light: var(--turquoise-light);

        --radius-8: 8px;
        --radius-12: 12px;
        --radius-16: 16px;
        --font-weight-normal: 400;
        --font-weight-semibold: 600;
        --font-weight-bold: 700;
        --font-weight-extrabold: 800;
      }
      @layer base {
        :root {
          /* light theme */
          --background: #ffffff;
          --blue: #007bff;
          --gray: #525252;
          --gray-light: #afaeb2;
          --yellow: #ffaf37;
          --orange: #ff5f37;
          --turquoise: #11a483;
          --blue-light: #f5faff;
          --yellow-light: #ffefd6;
          --orange-light: #ffe2db;
          --turquoise-light: #c3fff1;
        }
        .dark {
          --background: #060c18;
          --blue: #57a8ff;
          --gray: #525252;
          --gray-light: #afaeb2;
          --yellow: #ffaf37;
          --orange: #ff5f37;
          --turquoise: #11a483;
          --blue-light: #041933;
          --yellow-light: #ffefd6;
          --orange-light: #ffe2db;
          --turquoise-light: #c3fff1;
        }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>To-Do List</title>
  </head>
  <body class="font-yekan grid grid-cols-1 md:grid-cols-5">
    <header
      class="row-start-2 md:row-start-1 flex flex-col md:col-span-4 md:col-start-2 items-start p-4"
    >
      <h2 class="font-bold text-xl">تسک های امروز</h2>
      <p class="text-sm">3 تسک را باید انجام بدهید.</p>
    </header>
    <!-- for mehdi -->
    <main class="flex row-start-3 md:row-start-2 md:col-span-4"></main>
    <!-- for mehdi  -->
    <aside class="hidden md:flex md:flex-col p-4 ">
      <div class="flex items-start gap-2">
        <img src="./src/assets/images/Ellipse 136.png" class="rounded-full" alt="profile_photo" />
        <div class="flex flex-col">
          <h2 class="font-bold text-xl">سلام نام کاربر</h2>
          <p class="text-sm">تاریخ به روز شمسی</p>
        </div>
      </div>
      <nav>
        <ul>
          <li>
            <img src="./src/assets/icons/home.svg" alt="home-icon" />
            <span>خانه</span>
          </li>
          <li>
            <img src="./src/assets/icons/list.svg" alt="list-icon" />
            <span>تسک ها</span>
          </li>
          <li>
            <img src="./src/assets/icons/calendar.svg" alt="calendar-icon" />
            <span>تقویم</span>
          </li>
          <li>
            <img src="./src/assets/icons/report.svg" alt="report-icon" />
            <span>گزارشات</span>
          </li>
          <li>
            <img src="./src/assets/icons/setting.svg" alt="setting-icon" />
            <span>تنظیمات</span>
          </li>
          <li>
            <img src="./src/assets/icons/24-support.svg" alt="support" />
            <span>پشتیبانی</span>
          </li>
          <li>
            <img src="./src/assets/icons/Vector.svg" alt="profile" />
            <span>پروفایل</span>
          </li>
        </ul>
      </nav>
      <div>
        <section></section>
        <section></section>
      </div>
    </aside>
    <footer></footer>
  </body>
</html>
